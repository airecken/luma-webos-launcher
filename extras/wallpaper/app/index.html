<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Luma Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: none;
      }
      video {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #status {
        position: absolute;
        left: 50px;
        bottom: 40px;
        color: white;
        font: 24px sans-serif;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="status"></div>
    <script src="wallpaper.js"></script>
  </body>
</html>
